<!DOCTYPE html>
<html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSFiddle sfpz8L4w</title>

  <style>
    body{
  --bs-body-bg:rgb(34, 34, 34);
  height: 100vh;
}
.offcanvas-custom {
  width: 200px !important;
  max-width: 90vw; /* Адаптивно */
}

.offcanvas-start,
.offcanvas-end {
  top: 60px !important; /* Высота вашей шапки */
  height: calc(100vh - 60px) !important; /* Остальная высота */
}
section {
  padding-top: 100px; /* Высота вашей шапки */
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: center;
  gap: 30px;
  width: 100%;
  min-height: 100vh; /* Минимальная высота = вся высота экрана */
  background-color: rgb(34, 34, 34);
}

/* Блок услуг */
.services {
  max-width: 1900px;
  min-height: 100px;
  color: white;
}


.pulse-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      animation: pulse 6s ease-in-out infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.5;
        transform: scale(0.95);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

.curtain-btn {
  position: fixed !important;
  margin-top: 75px;
  margin-left: 15px;
  z-index: 1046;
  width: 40px;
  height: 40px;
  padding: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Стили для картинки внутри кнопки */
.curtain-btn img {
  width: 100%;
  height: 100%;
  object-fit: contain; /* Иконка вписывается в кнопку без обрезания */
  display: block;
}

  </style>

  
</head>
<body>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>




<nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Child free</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll" aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarScroll">
      <ul class="navbar-nav ms-auto my-2 my-lg-0 navbar-nav-scroll" style="--bs-scroll-height: 100px;">
        
        {% if user.username %}
          <li class="nav-item">
            <a class="nav-link" href="profile">{{ user.username }}</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="logout">Выйти</a>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link" href="sign-up">Регистрация</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="login_">Авторизоваться</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
<button class="btn fixed-top  btn-outline-secondary curtain-btn" 
        type="button" 
        data-bs-toggle="offcanvas" 
        data-bs-target="#offcanvasScrolling" 
        aria-controls="offcanvasScrolling"
        >
  <img src="https://img.icons8.com/?size=100&id=quuyJoZCkYni&format=png&color=ffffff" 
       style="width: 100%; height: 100%; object-fit: contain;" />
</button>

<div class="offcanvas offcanvas-start offcanvas-custom" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1" id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel" data-bs-theme="dark">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="offcanvasScrollingLabel">Меню</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    
      <div class="d-grid gap-2">
        <button class="btn btn-outline-primary" type="button" data-bs-dismiss="offcanvas" onclick="window.location.href='/'">Главная</button>
        <li><hr class="divider"></li>
        <button class="btn btn-outline-light" type="button" data-bs-dismiss="offcanvas" onclick="window.location.href='my_sessions'">Мои записи</button>

      </div>

  </div>
</div>

<section>
    {% block content %}
    {% endblock %}
</section>

  <script>
    
  </script>
</body>
</html>
